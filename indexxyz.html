<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cologne Geothermal Screening, XYZ/COG Viewer</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }

    .panel {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      width: 300px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .panel h1 {
      font-size: 16px;
      margin: 0 0 8px 0;
      color: #111;
      font-weight: 700;
    }

    .panel p {
      font-size: 13px;
      margin: 8px 0;
      line-height: 1.4;
      color: #444;
    }

    .legend {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    .legend-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    .bar {
      height: 12px;
      border-radius: 4px;
      background: linear-gradient(to right, #d73027, #fee08b, #1a9850);
      margin: 8px 0;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
    }

    .ticks {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666;
      font-weight: 500;
    }

    .status {
      margin-top: 15px;
      font-size: 11px;
      color: #888;
      font-style: italic;
    }

    /* Customizing Leaflet Controls */
    .leaflet-control-layers {
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
      border: none !important;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="panel">
  <h1>Geothermal Cologne</h1>
  <p>Interactive screening of shallow geothermal potential using GEE and Remote Sensing data.</p>
  
  <div class="legend">
    <div class="legend-title">Suitability Index</div>
    <div class="bar"></div>
    <div class="ticks"><span>Low</span><span>Moderate</span><span>High</span></div>
  </div>

  <div id="status" class="status">Initialising map...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://unpkg.com/proj4@2.9.0/dist/proj4.js"></script>
<script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>

<script>
  // Initial status
  const statusEl = document.getElementById('status');
  
  // Define projections (WGS84 UTM 32N common in NRW)
  proj4.defs("EPSG:25832","+proj=utm +zone=32 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs +type=crs");
  proj4.defs("EPSG:32632","+proj=utm +zone=32 +datum=WGS84 +units=m +no_defs");

  const map = L.map('map').setView([50.94, 6.96], 12);

  // Basemaps
  const osm = L.tileLayer('https://{s}.tile.osm.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'
  });

  // Layer containers
  let layers = {};
  const layerControl = L.control.layers({
    "OpenStreetMap": osm,
    "Topo Map": topo
  }, {}, { collapsed: false }).addTo(map);

  function loadLayer(url, name, options = {}) {
    statusEl.innerHTML = `Fetching ${name}...`;
    
    fetch(url)
      .then(res => res.arrayBuffer())
      .then(buff => parseGeoraster(buff))
      .then(georaster => {
        console.log(`Loaded ${name}:`, georaster);
        
        const layer = new GeoRasterLayer({
          georaster,
          opacity: options.opacity || 0.75,
          resolution: 256,
          pixelValuesToColorFn: values => {
            // If the raster has 3 or 4 bands, it's already an RGB/RGBA visual
            if (georaster.numberOfBands >= 3) {
              const r = values[0];
              const g = values[1];
              const b = values[2];
              const a = values[3] !== undefined ? values[3] / 255 : 1;
              if (r === 0 && g === 0 && b === 0) return null; // Simple NoData for 0,0,0
              return `rgba(${r},${g},${b},${a})`;
            }
            
            // Otherwise, colorize based on value (Suitability)
            const v = values[0];
            if (v === 0 || v === null || isNaN(v)) return null;
            
            // Scale 0.4 - 0.72 (matches our analysis)
            const t = Math.max(0, Math.min(1, (v - 0.4) / (0.72 - 0.4)));
            
            // Red-Yellow-Green ramp
            if (t < 0.5) {
              const p = t * 2;
              return `rgb(${Math.round(215 + p * (254-215))}, ${Math.round(48 + p * (224-48))}, ${Math.round(39 + p * (139-39))})`;
            } else {
              const p = (t - 0.5) * 2;
              return `rgb(${Math.round(254 + p * (26-254))}, ${Math.round(224 + p * (152-224))}, ${Math.round(139 + p * (80-139))})`;
            }
          }
        });
        
        layerControl.addOverlay(layer, name);
        if (options.visible) layer.addTo(map);
        
        statusEl.innerHTML = `Loaded: ${name}`;
      })
      .catch(err => {
        console.error(`Error loading ${name}:`, err);
        statusEl.innerHTML = `Error loading ${name}`;
      });
  }

  // Load the TIFF files directly
  // We use the "color" versions for visualization if available, 
  // or fall back to the data files we found in the folders.
  
  // Note: tiles_erdsonde and tiles_kollektor contain 'erdsonde_color.tif'
  loadLayer('./tiles_erdsonde/erdsonde_color.tif', 'Borehole Suitability', { visible: true });
  loadLayer('./tiles_kollektor/erdsonde_color.tif', 'Collector Suitability', { visible: false });

</script>

</body>
</html>
